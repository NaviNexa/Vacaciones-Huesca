<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía PDF · Vacaciones Huesca</title>
<style>
html,body{margin:0;height:100%;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.topbar{position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;gap:10px;align-items:center;padding:max(10px,env(safe-area-inset-top)) 10px 10px;background:rgba(10,20,36,.96);box-shadow:0 2px 14px rgba(0,0,0,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:12px;padding:11px 14px;font-weight:800;font-size:15px}
.back{background:#2f78c4;color:white;flex:1}
.open{background:white;color:#17324d;border:1px solid #cad5df}
.viewer{position:absolute;top:66px;left:0;right:0;bottom:0}
iframe{width:100%;height:100%;border:0;background:white}
.notice{display:none;color:white;padding:90px 18px 18px;text-align:center}
@media(max-width:480px){.topbar{gap:7px}.btn{font-size:14px;padding:10px 11px}.viewer{top:64px}}
</style>
</head>
<body>
<div class="topbar">
  <a class="btn back" href="./index.html">← Volver a la guía móvil</a>
  <a class="btn open" href="./guia.pdf" target="_blank" rel="noopener">PDF ↗</a>
</div>
<div class="viewer">
  <iframe src="./guia.pdf#view=FitH" title="Guía PDF"></iframe>
</div>
</body>
</html>
