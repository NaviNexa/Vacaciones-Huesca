<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía PDF · Vacaciones Huesca</title>
<style>
html,body{margin:0;height:100%;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.topbar{position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;gap:10px;align-items:center;padding:max(10px,env(safe-area-inset-top)) 10px 10px;background:rgba(10,20,36,.96);box-shadow:0 2px 14px rgba(0,0,0,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:12px;padding:11px 14px;font-weight:800;font-size:15px;border:0;cursor:pointer}
.back{background:#2f78c4;color:white;flex:1}
.open{background:white;color:#17324d;border:1px solid #cad5df}
.viewer{position:absolute;top:66px;left:0;right:0;bottom:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 8px 24px}
.viewer canvas{display:block;margin:0 auto 12px;max-width:100%;height:auto;box-shadow:0 2px 10px rgba(0,0,0,.4);border-radius:4px}
.status{color:#cfd8e3;text-align:center;padding:24px 18px;font-size:15px}
@media(max-width:480px){.topbar{gap:7px}.btn{font-size:14px;padding:10px 11px}.viewer{top:64px}}
</style>
</head>
<body>
<div class="topbar">
  <a class="btn back" href="./index.html">← Volver a la guía móvil</a>
  <a class="btn open" href="./guia.pdf" target="_blank" rel="noopener">PDF ↗</a>
</div>
<div class="viewer" id="viewer">
  <div class="status" id="status">Cargando PDF…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const viewer = document.getElementById('viewer');
const statusEl = document.getElementById('status');

async function renderPDF() {
  try {
    const pdf = await pdfjsLib.getDocument('./guia.pdf').promise;
    statusEl.remove();

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const targetWidth = viewer.clientWidth - 16;

    for (let num = 1; num <= pdf.numPages; num++) {
      const page = await pdf.getPage(num);
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = (targetWidth / baseViewport.width) * dpr;
      const viewport = page.getViewport({ scale });

      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = (viewport.width / dpr) + 'px';
      canvas.style.height = (viewport.height / dpr) + 'px';
      viewer.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
    }
  } catch (err) {
    statusEl.textContent = 'No se pudo cargar el PDF. Pulsa "PDF ↗" para abrirlo directamente.';
    console.error(err);
  }
}

renderPDF();
</script>
</body>
</html>
